services:
  postgres-test:
    image: postgres:16-alpine
    container_name: constructionops-test-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: constructionops_test
    ports:
      - "5433:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql/data

volumes:
  pgtestdata:
